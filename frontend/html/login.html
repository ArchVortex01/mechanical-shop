<!DOCTYPE html>
<html lang="en"> 
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MahtoMech — Mechanical Shop & Vehicle Parts</title>
    <link rel="stylesheet" href="../css/style.css">
    <link rel="stylesheet" href="../css/login.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
</head>
<body>
    <header>
        <nav id="nav-bar">
            <a href="index.html" class="brand-logo">
                <div class="logo-icon">
                    <i class="fas fa-cog gear big-gear"></i>
                    <i class="fas fa-cog gear small-gear"></i>
                </div>

                MAHTO<span>MECH</span>
            </a>
            <ul class="nav-link">
                <li><a href="index.html" class="active">Home</a></li>
                <li><a href="service.html">Services</a></li>
                <li><a href="buy-parts.html">Buy Parts</a></li>
                <li><a href="booking.html">Book Service</a></li>
                <li><a href="contact.html">Contact</a></li>
            </ul>
            <div class="nav-action">
                <div class="search-box">
                    <input type="text" placeholder="Search Components, fixes..." id="Searchbar">   
                </div>
                <a href="login.html" class="login-logo" title="Login"><i class="fas fa-user"></i></a>
                <a href="cart.html" class="cart-logo" title="Cart">🛒<span class="shopping-cart" id="Cardcount">0</span></a>
                <button class="nav-toggle" id="navToggle" aria-label="Toggle Navigation"><i class="fas fa-bars"></i></button>
            </div>
        </nav>
    </header>


    <div class="login-page">
        <div class="login-card">
            <div class="login-card-header">
                <h1>SIGN <span>IN</span></h1>
                <p>Sign in with your Customer or Admin account</p>
            </div>

            <form method="post" action="#submit" novalidate>
                <div class="login-form-group">
                    <label for="email">Email or Phone No</label>
                    <input type="text" name="email" id="email" placeholder="your@gmail.com or +91 XXXXX XXXXX" autocomplete="username" required>
                </div>

                <div class="login-form-group">
                    <label for="password">Password</label>
                    <div style="position: relative;">
                        <input type="password" name="password" id="password" placeholder="Enter Your Password" autocomplete="current-password" required style="padding-right: 42px;">
                        <i class="fas fa-eye" id="togglePasswordBtn" style="position: absolute; right: 14px; top: 50%; transform: translateY(-50%); cursor: pointer; color: #94a3b8; font-size: 0.95rem;"></i>
                    </div>
                </div>

                <div class="login-checkbox-group">
                    <div>
                        <input type="checkbox" name="remember" id="remember" checked>
                        <label for="remember">Remember me</label>
                    </div>
                    <a href="#" class="forgot-link">Forgot Password?</a>
                </div>

                <button type="submit" class="button-submit">SIGN IN</button>
            </form>
            <div class="divider">OR</div>

            <div class="sign-buttons">
                <button class="sign-btn" title="Google Login">
                     <i class="fab fa-google"></i>
                </button>
                <button class="sign-btn" title="Phone Login">
                     <i class="fas fa-phone"></i>
                </button>
            </div>
            <div class="login-form-footer">Don't have an account?
                <a href="#" id="registerLink">Register here</a>
            </div>

        </div>
    </div>

    <footer>
        <div class="footer-bottom">
            <p>© 2026 <span>MahtoMech</span>. All rights reserved. Made with 🔧 for car enthusiasts.</p>
            <div class="payment-icons">
                <div class="payment-icon">UPI</div>
                <div class="payment-icon">VISA</div>
                <div class="payment-icon">MC</div>
                <div class="payment-icon">PayTM</div>
            </div>
        </div>
    </footer>

    <script src="../js/api.js"></script>
    <script src="../js/main.js" defer></script>
    <script src="../js/login.js" defer></script>
</body>
</html>
